[pytest]
testpaths = tests
addopts = -m "not performance"
markers =
    integration: needs local PostgreSQL and LocalStack S3 (skipped automatically if unavailable)
    performance: scale, throughput and SLA benchmark (slow); run with: python -m pytest -m performance -s
filterwarnings =
    # Raised inside fastparquet (third-party) when reading timestamps; harmless, not from our code
    ignore:The 'generic' unit for NumPy timedelta
